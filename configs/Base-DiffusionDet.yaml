# DiffusionDet 公共模型与输入默认值。
# 本地实验必须在 configs/experiments/ 中覆盖数据集、训练计划和 EXPERIMENT 元数据。
MODEL:
  META_ARCHITECTURE: "DiffusionDet"
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl" # 使用 ImageNet 预训练权重
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
  RESNETS:
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ROI_HEADS:
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
  ROI_BOX_HEAD:
    POOLER_TYPE: "ROIAlignV2"
    POOLER_RESOLUTION: 7
    POOLER_SAMPLING_RATIO: 2

SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.000025
  STEPS: (210000, 250000)
  MAX_ITER: 270000
  WARMUP_FACTOR: 0.01
  WARMUP_ITERS: 1000
  OPTIMIZER: "ADAMW"
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 1.0

INPUT:
  MIN_SIZE_TRAIN: (256, 384, 512, 640, 768, 896, 1024)
  MAX_SIZE_TRAIN: 1024
  MIN_SIZE_TEST: 256
  MAX_SIZE_TEST: 1024
  CROP:
    ENABLED: True
  FORMAT: "RGB"

VERSION: 2
