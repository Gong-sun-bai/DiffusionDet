# YOLO SAR 对比实验公共口径：除 model/name 外须与 yolo-sar-001/003 完全一致。
task: detect
mode: train
model: yolo11n.pt
data: configs/yolo/sar_ship/sar_ship.yaml

# 训练规模：254264 * 25 / 31783 = 200 个 SAR 训练集遍历周期。
epochs: 200
time: null
patience: 0
batch: 25
imgsz: 256
save: true
save_period: -1
cache: false
device: 0
workers: 4
project: runs/yolo/sar_ship
name: yolo-sar-002__yolo11n-pretrained-img256-bs25-ep200-seed40244023
exist_ok: false
pretrained: true
cls_remap: true
optimizer: auto
verbose: true
seed: 40244023
deterministic: true
single_cls: false
rect: false
cos_lr: false
close_mosaic: 10
resume: false
amp: false
fraction: 1.0
profile: false
freeze: null
multi_scale: 0.0
compile: false

# 验证与 COCOeval 桥接。训练结束后 predictions.json 对应 best.pt 的最终验证。
val: true
split: val
save_json: true
conf: null
iou: 0.7
max_det: 100
plots: true
end2end: null

# Ultralytics 8.4.91 默认优化器、损失和增强参数；显式冻结以保证三代模型一致。
