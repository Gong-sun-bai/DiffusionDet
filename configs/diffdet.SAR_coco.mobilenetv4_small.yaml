_BASE_: "Base-DiffusionDet.yaml" # 继承基础配置

MODEL:
  # 骨干网络配置：使用 MobileNetV4 + FPN
  BACKBONE:
    NAME: "build_mobilenetv4_fpn_backbone"  # 使用 MobileNetV4 + FPN
  
  # MobileNetV4 配置
  MOBILENETV4:
    SIZE: "small"  # 可选: "small", "medium", "large"
    OUT_FEATURES: ["stage1", "stage2", "stage3", "stage4"]  # 输出的特征层
    NORM: "BN"
    WIDTH_MULTIPLIER: 1.0  # 宽度乘数，可调整模型大小
  
  # FPN 配置（适配 MobileNetV4 输出）
  FPN:
    IN_FEATURES: ["stage1", "stage2", "stage3", "stage4"]  # 对应 MobileNetV4 的输出
    OUT_CHANNELS: 64  # FPN 输出通道数，可根据需要调整
  
  # ROI 配置
  ROI_HEADS:
    IN_FEATURES: ["p2", "p3", "p4", "p5"]  # FPN 输出的特征层
  
  # DiffusionDet 配置
  DiffusionDet:
    NUM_PROPOSALS: 500   # 每帧生成的随机框数量
    NUM_CLASSES: 1       # 类别数（ship）
    HIDDEN_DIM: 64       # Transformer 中间特征维度

DATASETS:
  TRAIN: ("sar_ship_train",)
  TEST: ("sar_ship_val",)

SOLVER:
  # 根据数据集大小和训练周期计算 MAX_ITER
  # 假设数据集有 31783 张图，BatchSize=64，Epoch=200
  # MAX_ITER = (31783 / 64) * 200 ≈ 99400
  MAX_ITER: 99400
  CHECKPOINT_PERIOD: 5000
  STEPS: (69580, 89514)  # 在总迭代的 70% 和 90% 处降学习率

INPUT:
  CROP:
    ENABLED: True  # 开启随机裁剪增强

OUTPUT_DIR: "./output_mobilenetv4_small"
