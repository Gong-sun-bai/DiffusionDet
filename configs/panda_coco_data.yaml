_BASE_: "Base-DiffusionDet.yaml" # 继承基础配置
MODEL:
  RESNETS:
    DEPTH: 50            # 使用 ResNet-18，默认 ResNet-50
    STRIDE_IN_1X1: False
    RES2_OUT_CHANNELS: 256 # ResNet-18 的初始通道数，修改此项可减小模型大小，默认直接删
  DiffusionDet:
    NUM_PROPOSALS: 500   # 每一帧生成的随机框数量
    NUM_CLASSES: 4
    HIDDEN_DIM: 256      # Transformer 中间特征维度，修改此项可减小模型大小，默认直接删
DATASETS:
  TRAIN: ("panda_yolo_train",)
  TEST: ("panda_yolo_val",)
SOLVER:
  # 【计算处：根据 Epoch 200 重新计算 MAX_ITER】
  # 假设数据集有 3925 | 31783 张图，BatchSize=32 | 16 ，Epoch=200
  # MAX_ITER = (3925 / 16) * 200 = 49062.5 约等于 49063
  MAX_ITER: 49063 # 397288
  CHECKPOINT_PERIOD: 5000 # 每 10000 次迭代保存一次模型
  STEPS: (34344,44157)   # 在总迭代的 70% 和 90% 处降学习率
INPUT:
  CROP:
    ENABLED: True         # 开启随机裁剪增强

