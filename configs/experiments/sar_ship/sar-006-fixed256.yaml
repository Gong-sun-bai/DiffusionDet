_BASE_: "../../machine/Rtx2080ti-Base-DiffusionDet.yaml" # 直接继承 RTX 2080 Ti 的 R18/FPN128 SAR 公共父配置。

EXPERIMENT: # 实验身份、消融假设和输出目录元数据。
  ID: "sar-006" # 仓库内唯一的正式 SAR 实验编号。
  NAME: "r18-fpn128-h128-bs25-it254264-fixed256-seed40244023" # 概括结构、Batch、迭代数、固定输入和种子的目录名后缀。
  DATASET: "sar_ship" # 实验数据集标识，并决定 runs 下的数据集子目录。
  DESCRIPTION: "以 sar-005 为对照，保持种子、Batch、学习率和迭代数不变，将输入改为固定 256，用于检验多尺度是否导致精度退化；周期验证及 latest/best 仅改变结果记录。" # 可选说明，仅记录实验目的、主要改动和重要限制，不参与运行逻辑。
  OUTPUT_ROOT: "./runs" # 运行产物根目录，相对路径按仓库根目录解析。

INPUT: # 固定训练和评估图像的缩放尺寸。
  MIN_SIZE_TRAIN: (256,) # 训练时唯一可选短边尺寸为 256；单元素元组末尾逗号不可省略。
  MAX_SIZE_TRAIN: 256 # 训练缩放后长边最多为 256 像素。
  MAX_SIZE_TEST: 256 # 评估缩放后长边最多为 256 像素。

SOLVER: # 周期检查点的保存方式和间隔。
  IMS_PER_BATCH: 25 # 与 sar-005 一致，单 GPU 每次迭代使用 25 张图像。
  BASE_LR: 0.000035 # 与 sar-005 一致，使用 Batch 25 对应的基础学习率。
  MAX_ITER: 254264 # 与 sar-005 一致，保持相同的优化迭代总数。
  STEPS: (177985, 228838) # 与 sar-005 一致，在约 70% 和 90% 处衰减学习率。
  CHECKPOINT_RETENTION: "latest" # 周期保存时覆盖 model_latest.pth，避免累计大量检查点。

TEST: # 训练期间的周期验证与最佳权重选择设置。
  EVAL_PERIOD: 5000 # 每 5000 次训练迭代运行一次验证集评估。
  BEST_CHECKPOINT: # 根据验证指标维护独立的 model_best.pth。
    ENABLED: True # 启用最佳检查点保存。
    METRIC: "bbox/AP" # 使用 COCO bbox AP 作为最佳权重判定指标。
    MODE: "max" # 指标越大越好，仅在 AP 创新高时覆盖最佳权重。
