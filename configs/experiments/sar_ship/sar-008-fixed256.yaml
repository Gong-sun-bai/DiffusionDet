_BASE_: "sar-005.yaml"

EXPERIMENT:
  ID: "sar-008"
  NAME: "r18-fpn128-h128-bs25-it254264-fixed256-seed40244023"
  DATASET: "sar_ship"
  TRACK: "reproducibility"
  KIND: "ablation"
  BASELINE: "sar-005"
  PURPOSE: "在保持 sar-005 的批量、优化器步数和固定种子不变时，恢复 sar-001 的固定 256 输入尺度，检验输入尺度是否解释复现差距；验证与权重保留策略只用于记录结果，不改变训练更新"
  HYPOTHESIS: "固定 256 输入将使结果明显接近 sar-001，同时 model_latest 与 model_best 可分别支持可靠续训和最佳精度复评"
  CHANGES:
    - "INPUT.MIN_SIZE_TRAIN: (256, 384, 512, 640, 768, 896, 1024) -> (256,)"
    - "INPUT.MAX_SIZE_TRAIN: 1024 -> 256"
    - "INPUT.MAX_SIZE_TEST: 1024 -> 256"
    - "SOLVER.CHECKPOINT_RETENTION: all -> latest"
    - "TEST.EVAL_PERIOD: 0 -> 5000"
    - "TEST.BEST_CHECKPOINT.ENABLED: False -> True"
  OUTPUT_ROOT: "./runs"

INPUT:
  MIN_SIZE_TRAIN: (256,)
  MAX_SIZE_TRAIN: 256
  MIN_SIZE_TEST: 256
  MAX_SIZE_TEST: 256

SOLVER:
  CHECKPOINT_RETENTION: "latest"
  IMS_PER_BATCH: 32
  BASE_LR: 0.000045
  MAX_ITER: 198644
  CHECKPOINT_PERIOD: 5000
  STEPS: (139051, 178780)

TEST:
  EVAL_PERIOD: 5000
  BEST_CHECKPOINT:
    ENABLED: True
    METRIC: "bbox/AP"
    MODE: "max"
