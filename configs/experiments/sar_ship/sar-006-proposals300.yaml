_BASE_: "sar-005.yaml"

# 单因素消融示例：复制此文件时必须分配新 ID，并只修改一个概念因素。
EXPERIMENT:
  ID: "sar-006"
  NAME: "r18-fpn128-h128-proposals300-seed40244023"
  DATASET: "sar_ship"
  TRACK: "accuracy"
  KIND: "ablation"
  BASELINE: "sar-005"
  PURPOSE: "测量 proposal 数量对 SAR 检测精度与推理开销的影响"
  HYPOTHESIS: "将 proposal 从 500 降到 300 可降低计算量且只带来有限 AP 损失"
  CHANGES:
    - "MODEL.DiffusionDet.NUM_PROPOSALS: 500 -> 300"
  OUTPUT_ROOT: "./runs"

MODEL:
  DiffusionDet:
    NUM_PROPOSALS: 300

