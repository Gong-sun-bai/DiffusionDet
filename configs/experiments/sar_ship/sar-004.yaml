# 历史只读配置：原 output_mobilenetv4_medium。完全自包含；延长训练后 milestones 未重算。
EXPERIMENT:
  ID: "sar-004"
  NAME: "mnv4-medium-fpn96-h96-bs50-it119280-scratch"
  DATASET: "sar_ship"
  TRACK: "efficiency"
  KIND: "historical"
  BASELINE: "sar-003"
  PURPOSE: "记录 MobileNetV4-Medium 的历史精度与体量权衡"
  HYPOTHESIS: "中型移动骨干可用适度参数换取更高精度"
  CHANGES:
    - "MODEL.MOBILENETV4.SIZE: small -> medium"
    - "MODEL.FPN.OUT_CHANNELS: 64 -> 96"
    - "MODEL.DiffusionDet.HIDDEN_DIM: 64 -> 96"
    - "SOLVER.IMS_PER_BATCH: 64 -> 50"
    - "SOLVER.MAX_ITER: 99400 -> 119280"
  OUTPUT_ROOT: "./runs"

MODEL:
  META_ARCHITECTURE: "DiffusionDet"
  WEIGHTS: ""
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  BACKBONE:
    NAME: "build_mobilenetv4_fpn_backbone"
  MOBILENETV4:
    SIZE: "medium"
    OUT_FEATURES: ["stage1", "stage2", "stage3", "stage4"]
    NORM: "BN"
    WIDTH_MULTIPLIER: 1.0
  FPN:
    IN_FEATURES: ["stage1", "stage2", "stage3", "stage4"]
    OUT_CHANNELS: 96
  ROI_HEADS:
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
  ROI_BOX_HEAD:
    NUM_FC: 2
    FC_DIM: 256
    POOLER_TYPE: "ROIAlignV2"
    POOLER_RESOLUTION: 7
    POOLER_SAMPLING_RATIO: 2
  DiffusionDet:
    NUM_PROPOSALS: 500
    NUM_CLASSES: 1
    HIDDEN_DIM: 96
    NUM_HEADS: 6
    NUM_CLS: 1
    NUM_REG: 3
    NHEADS: 8
    DIM_FEEDFORWARD: 2048
    DROPOUT: 0.0
    ACTIVATION: "relu"
    NUM_DYNAMIC: 2
    DIM_DYNAMIC: 64
    CLASS_WEIGHT: 2.0
    GIOU_WEIGHT: 2.0
    L1_WEIGHT: 5.0
    NO_OBJECT_WEIGHT: 0.1
    DEEP_SUPERVISION: True
    USE_FOCAL: True
    USE_FED_LOSS: False
    ALPHA: 0.25
    GAMMA: 2.0
    PRIOR_PROB: 0.01
    OTA_K: 5
    SNR_SCALE: 2.0
    SAMPLE_STEP: 1
    USE_NMS: True

DATASETS:
  TRAIN: ("sar_ship_train",)
  TEST: ("sar_ship_val",)

DATALOADER:
  NUM_WORKERS: 4

INPUT:
  MIN_SIZE_TRAIN: (256,)
  MAX_SIZE_TRAIN: 256
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 256
  MAX_SIZE_TEST: 256
  RANDOM_FLIP: "horizontal"
  FORMAT: "RGB"
  CROP:
    ENABLED: True
    TYPE: "relative_range"
    SIZE: [0.9, 0.9]

SEED: -1
SOLVER:
  IMS_PER_BATCH: 50
  BASE_LR: 0.000025
  MAX_ITER: 119280
  CHECKPOINT_PERIOD: 10000
  STEPS: (69580, 89514)
  WARMUP_FACTOR: 0.01
  WARMUP_ITERS: 1000
  WARMUP_METHOD: "linear"
  OPTIMIZER: "ADAMW"
  WEIGHT_DECAY: 0.0001
  AMP:
    ENABLED: False
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 1.0

TEST:
  EVAL_PERIOD: 0
  DETECTIONS_PER_IMAGE: 100
  AUG:
    ENABLED: False

VERSION: 2
