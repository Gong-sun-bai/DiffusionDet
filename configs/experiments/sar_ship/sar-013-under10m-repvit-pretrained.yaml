_BASE_: "../../machine/Rtx2080ti-SAR-Under10M.yaml"

EXPERIMENT:
  ID: "sar-013"
  NAME: "repvit-m09-h128-shared-pretrained-screen"
  DATASET: "sar_ship"
  DESCRIPTION: "以 sar-012 的共享 H128/FPN128 检测器为对照，将 backbone 换为 ImageNet 预训练 RepViT-M0.9，作为 9.5M 内精度优先候选。"
  OUTPUT_ROOT: "./runs"

MODEL:
  BACKBONE:
    NAME: "build_timm_fpn_backbone"
  FPN:
    IN_FEATURES: ["stage1", "stage2", "stage3", "stage4"]
    OUT_CHANNELS: 128
  TIMM:
    NAME: "repvit_m0_9.dist_450e_in1k"
    PRETRAINED: True
    OUT_INDICES: [0, 1, 2, 3]
    OUT_FEATURES: ["stage1", "stage2", "stage3", "stage4"]
  DiffusionDet:
    HIDDEN_DIM: 128
    HEAD_SHARING: "full"

